[workspace]
resolver = "2"
members = [
    "crates/compact-core",
    "crates/compact-cli",
    "crates/compact-ffi",
]

[workspace.package]
version = "0.9.0"
edition = "2024"
license = "MIT"
authors = ["tuannm99"]

[workspace.dependencies]
anyhow = "1.0"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
